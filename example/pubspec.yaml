name: iqchannels_example
version: 1.0.0+1
publish_to: 'none'
description: "Demonstrates how to use the iqchannels plugin."

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  iqchannels:
    path: ../
  material_ui: ^1.10.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/style.json
    - assets/uz.json
    - assets/ru.json
name: iqchannels
version: 0.1.0
homepage: "none"
description: "A new Flutter project."

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.iqchannels
        pluginClass: IqchannelsPlugin
      ios:
        pluginClass: IqchannelsPlugin
      linux:
        pluginClass: IqchannelsPlugin
      macos:
        pluginClass: IqchannelsPlugin
      windows:
        pluginClass: IqchannelsPluginCApi
      web:
        pluginClass: IqchannelsWeb
        fileName: iqchannels_web.dart

